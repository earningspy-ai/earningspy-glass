name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Tests
        run: >-
          python -m pytest --cov=earningspy_glass --cov-branch
          --cov-report=term-missing:skip-covered

  quality:
    name: lint, audit, wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install --quiet -r .github/requirements/quality.txt -r .github/requirements/build.txt
          ruff check .

      - name: Check the workflows
        run: |
          actionlint
          zizmor --offline --min-severity medium .github

      - name: Build and check the package
        run: |
          python -m build --outdir "$RUNNER_TEMP/dist"
          twine check --strict "$RUNNER_TEMP"/dist/*

      # What a client's machine would install, checked against known vulnerabilities.
      - name: Audit what it installs
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/pip" freeze --exclude earningspy-glass > "$RUNNER_TEMP/frozen.txt"
          pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/frozen.txt"

  # The one check `main` requires: it stands for every job above, whatever they are named.
  all:
    name: All checks
    if: always()
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
