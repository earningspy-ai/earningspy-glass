name: Release

# A tag `vX.Y.Z` releases earningspy-glass X.Y.Z:
#
#   guard      the tagged commit is on main, and the CHANGELOG has the version's section
#   build      one wheel (pure Python: py3-none-any works on every 3.x) + sdist,
#              the tag must equal the package version, the wheel must hold only
#              what clients may read
#   test       that SAME wheel installed in a clean environment on 3.10-3.13,
#              the Glass suite run against it (not against the source folder)
#   pypi       the files to PyPI, by trusted publishing (no token stored). Never on the
#              tag push: only when run by hand on the tag, with the tag typed again,
#              and once the `pypi` environment's reviewer approves:
#                gh workflow run release.yml --ref vX.Y.Z -f publish=vX.Y.Z
#              A version published there can never be replaced.
#   release    a GitHub release with the same files

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "The tag to publish to PyPI, typed again (run this ON that tag)"
        required: true

# One release at a time; never cancel a publish halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The publisher role trusts any `v*` tag, so this is what keeps an unmerged
      # branch from being released.
      - name: The tagged commit must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main. Merge first, then tag main."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} (expected v${version})"
            exit 1
          fi
          grep -qF "## [${version}]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist
          twine check --strict dist/*

      # One wheel, pure Python, holding only the code and the documents a client
      # may read. Anything else (internal notes, config) stops the release.
      - name: Check what the wheel ships
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected exactly one wheel"; exit 1; }
          case "${wheels[0]}" in *-py3-none-any.whl) ;; *) echo "::error::not a pure-Python wheel: ${wheels[0]}"; exit 1;; esac
          unexpected="$(python - "${wheels[0]}" <<'PY'
          import re, sys, zipfile
          allowed = re.compile(r"^(earningspy_glass/([A-Za-z0-9_]+\.py|sample\.json)"
                               r"|earningspy_glass-[^/]+\.dist-info/.+)$")
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n == "earningspy_glass/__init__.py" for n in names), "no code in the wheel"
          print("\n".join(n for n in names if not allowed.match(n)))
          PY
          )"
          if [ -n "$unexpected" ]; then
            echo "::error::the wheel ships files clients should not get:"; echo "$unexpected"; exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the wheel on Python ${{ matrix.python-version }} (${{ matrix.deps }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["plotly requests"]
        include:
          # The oldest dependencies the package says it supports.
          - python-version: "3.10"
            deps: "plotly==5.22.0 requests==2.31.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The files are the ones that were built
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install ${{ matrix.deps }} "$(ls dist/*.whl)[test]"

      # Run from outside the checkout so `import earningspy_glass` can only find
      # the installed wheel, never the source folder at the repo root.
      - name: Run the Glass suite against the installed wheel
        run: |
          cp -R tests "$RUNNER_TEMP/glass-tests"
          cd "$RUNNER_TEMP/glass-tests"
          "$RUNNER_TEMP/venv/bin/python" -c "import earningspy_glass as g, sys; assert 'site-packages' in g.__file__, g.__file__; print(g.__version__, g.__file__)"
          "$RUNNER_TEMP/venv/bin/pytest" -q -p no:cacheprovider --rootdir=. --confcutdir=.

  pypi:
    name: PyPI ${{ needs.build.outputs.version }}
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
      && inputs.publish == github.ref_name
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The files are the ones that were tested
        working-directory: dist
        run: sha256sum --check SHA256SUMS && rm SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  release:
    name: GitHub release ${{ needs.build.outputs.version }}
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      # Release notes: this version's section of the CHANGELOG (Keep a Changelog).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release exists"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "earningspy-glass ${VERSION}" --notes-file notes.md
