name: Release

# A tag `vX.Y.Z` releases earningspy-glass X.Y.Z. The tag is made by merging the release
# pull request (release-please.yml), never by hand.
#
#   build      one wheel (pure Python: py3-none-any works on every 3.x) + sdist; the tag is
#              on main, equals the package version, has its CHANGELOG section, and the
#              wheel holds only what clients may read
#   test       that SAME wheel in a clean environment on 3.10-3.13
#   gate       the `pypi` environment still waits for its one approver, or nothing goes out
#   pypi       waits for that approval, then publishes by trusted publishing (no token)
#   verify     PyPI serves the very files that were tested, and they work
#   release    the same files, with provenance, on the GitHub release, made public last
#
# A version published to PyPI can never be replaced. To retry a failed release, re-run its
# failed jobs, or run this workflow by hand on the tag: the approval still holds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One run per version; never cancel a publish halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPROVER: c4road

jobs:
  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # PyPI trusts any `v*` tag, so this keeps an unmerged branch from being released.
      - name: The tagged commit must be on main
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::Run this on a tag."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main. Merge first, then tag main."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} (expected v${version})"
            exit 1
          fi
          grep -qF "## [${version}]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          python -m pip install -r .github/requirements/build.txt
          python -m build --outdir dist
          twine check --strict dist/*

      # One wheel, pure Python, holding only the code and the documents a client
      # may read. Anything else (internal notes, config) stops the release.
      - name: Check what the wheel ships
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected exactly one wheel"; exit 1; }
          case "${wheels[0]}" in *-py3-none-any.whl) ;; *) echo "::error::not a pure-Python wheel: ${wheels[0]}"; exit 1;; esac
          unexpected="$(python - "${wheels[0]}" <<'PY'
          import re, sys, zipfile
          allowed = re.compile(r"^(earningspy_glass/([A-Za-z0-9_]+\.py|sample\.json)"
                               r"|earningspy_glass-[^/]+\.dist-info/.+)$")
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n == "earningspy_glass/__init__.py" for n in names), "no code in the wheel"
          print("\n".join(n for n in names if not allowed.match(n)))
          PY
          )"
          if [ -n "$unexpected" ]; then
            echo "::error::the wheel ships files clients should not get:"; echo "$unexpected"; exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the wheel on Python ${{ matrix.python-version }} (${{ matrix.deps }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["plotly requests"]
        include:
          # The oldest dependencies the package says it supports.
          - python-version: "3.10"
            deps: "plotly==5.22.0 requests==2.31.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The files are the ones that were built
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install ${{ matrix.deps }} "$(ls dist/*.whl)[test]"

      # Run from outside the checkout so `import earningspy_glass` can only find
      # the installed wheel, never the source folder at the repo root.
      - name: Run the Glass suite against the installed wheel
        run: |
          cp -R tests "$RUNNER_TEMP/glass-tests"
          cd "$RUNNER_TEMP/glass-tests"
          "$RUNNER_TEMP/venv/bin/python" -c "import earningspy_glass as g, sys; assert 'site-packages' in g.__file__, g.__file__; print(g.__version__, g.__file__)"
          "$RUNNER_TEMP/venv/bin/pytest" -q -p no:cacheprovider --rootdir=. --confcutdir=.

  gate:
    name: The approval is in place
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # An environment that is missing or lost its reviewer would publish unasked.
      - name: The pypi environment has its one approver and takes only v* tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/environments/pypi"
          reviewers="$(gh api "$api" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[] | (.reviewer.login // .reviewer.slug)] | join(",")')"
          [ "$reviewers" = "$APPROVER" ] || { echo "::error::pypi must be approved by ${APPROVER} alone (now: '${reviewers}')"; exit 1; }
          rules="$(gh api "$api/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type):\(.name)"] | join(",")')"
          [ "$rules" = "tag:v*" ] || { echo "::error::pypi must take only v* tags (now: '${rules}')"; exit 1; }

  pypi:
    name: PyPI ${{ needs.build.outputs.version }}
    needs: [build, test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/earningspy-glass/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The files are the ones that were tested
        working-directory: dist
        run: sha256sum --check SHA256SUMS && rm SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  verify:
    name: Install from PyPI
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: built/

      - name: PyPI serves the tested wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          pip="$RUNNER_TEMP/venv/bin/pip"
          for _ in $(seq 20); do            # a new version takes a moment to be listed
            if "$pip" download --quiet --no-cache-dir --no-deps --only-binary :all: -d served "earningspy-glass==${VERSION}"; then break; fi
            sleep 15
          done
          cmp served/*.whl built/*.whl

      - name: A clean install works
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-cache-dir "earningspy-glass==${VERSION}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os
          import earningspy_glass as g
          assert g.__version__ == os.environ["VERSION"], g.__version__
          assert g.sample().plot("grade_card").data
          PY

  release:
    name: GitHub release ${{ needs.build.outputs.version }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write        # signs the provenance
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # release-please drafted it with its notes; without a draft, the notes are this
      # version's CHANGELOG section. Files first, public last.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then echo "${TAG} is already public"; exit 0; fi
          if [ "$state" = none ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' CHANGELOG.md > notes.md
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
